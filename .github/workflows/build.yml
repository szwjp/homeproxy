name: Build

on:
  # 自动 push / pull_request 触发器已移除：单文件 LuCI 插件发版节奏由人工控制，
  # 避免每次 commit 都推 release。手动从 Actions UI 触发 workflow_dispatch。
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 锁定 apk-tools 的具体 commit，避免上游改打包格式/参数导致 CI 无预警地坏掉。
  # 升级这个 SHA 时，下面的缓存 key 会自动失效并重新编译一次。
  APK_TOOLS_REF: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

  # po/ 目录到 LuCI i18n 包名的映射，build-pkg.sh 会读这个 env 来填
  # LUCI_LOCALE_MAP。要加语言就在这里加，build-pkg.sh 不用动。
  # 格式：<po_dir>=<i18n_locale>，多个用逗号分隔。
  LUCI_LANGUAGES: 'zh_Hans=zh-cn,zh_Hant=zh-tw,pt_BR=pt-br,bn_BD=bn'

jobs:
  # -------------------------------------------------------------------------
  # 1. 版本检查 + 创建 release 壳
  #    解析 Makefile 里的 PKG_VERSION/PKG_RELEASE，对比远端 latest tag，
  #    只有本地版本更高（has_update=true）才往下走 build。
  # -------------------------------------------------------------------------
  job_check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check_version.outputs.version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
    steps:
      - name: Checkout source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Parse Makefile version
        id: check_version
        env:
          url_tags: https://api.github.com/repos/${{ github.repository }}/releases/latest
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"

          pkg_version=$(awk -F ':=' '/^PKG_VERSION:=/ {print $2}' Makefile | tr -d ' \n' || true)
          pkg_release=$(awk -F ':=' '/^PKG_RELEASE:=/ {print $2}' Makefile | tr -d ' \n' || true)

          if [ -z "$pkg_version" ]; then
            echo "::error::PKG_VERSION not found in Makefile"
            exit 1
          fi

          if [ -n "$pkg_release" ]; then
            version="${pkg_version}-r${pkg_release}"
          else
            version="$pkg_version"
          fi

          echo "Local version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # 取远端 latest tag。空响应或 404 一律当作 has_update=true，
          # 让首次运行（仓库尚无 release）也能正常往下走。
          remote_latest=$(wget -qO- -t1 -T5 "$url_tags" | jq -r '.tag_name // empty' 2>/dev/null || true)
          if [ -z "$remote_latest" ]; then
            echo "Remote latest tag unavailable (empty repository or transient error) — treating as has_update=true"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Remote latest: ${remote_latest}"
          # 去掉 v 前缀做比较
          remote_version="${remote_latest#v}"

          if [ "$version" = "$remote_version" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release body
        if: steps.check_version.outputs.has_update == 'true'
        env:
          VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          # 极简 body：只放一个 shields.io 下载量 badge。
          # 瀑布流里 title 已经显示 v<version>，左 list 也有版本号，
          # changelog / commit 列表 / "First tagged release" 之类的元数据用户
          # 都不想要，保持最干净。
          {
            echo "![](https://img.shields.io/github/downloads/${GITHUB_REPOSITORY}/v${VERSION}/total?style=flat-square)"
          } > release.txt
          echo "--- release.txt ---"
          cat release.txt
          echo "--------------------"

      - name: Create release
        if: steps.check_version.outputs.has_update == 'true'
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: v${{ steps.check_version.outputs.version }}
          body_path: release.txt
          # 第一次只建 release + 写 body，不传 files；资产由 job_build 追加。
          # 这样 build job 失败时 release 仍然存在，可单独重试 build job。
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  # -------------------------------------------------------------------------
  # 2. 编译 + 上传资产到既有 release
  #    toolchain 准备（apk-tools cache / po2lmo / ipkg-build）原样保留；
  #    编译产物通过 .github/build-pkg.sh 调两次产出 apk + ipk。
  # -------------------------------------------------------------------------
  job_build:
    name: Build packages
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0   # build-pkg.sh 的 git describe/rev-parse 兜底需要完整历史

      - name: Cache apk-tools binary
        id: cache-apk-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /usr/local/bin/apk
          key: apk-tools-${{ env.APK_TOOLS_REF }}-${{ runner.os }}

      - name: Checkout apk-tools
        if: steps.cache-apk-tools.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: ${{ env.APK_TOOLS_REF }}

      - name: Checkout po2lmo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          if [ "${{ steps.cache-apk-tools.outputs.cache-hit }}" != "true" ]; then
            pushd apk-tools
            meson setup build \
              -Db_lto=true \
              -Dcompressed-help=false \
              -Ddocs=disabled \
              -Dhelp=enabled \
              -Dlua_version=5.1 \
              -Ddefault_library=static \
              -Durl_backend=wget \
              -Dzstd=false \
              -Dpython=disabled \
              -Dtests=disabled \
              -Dcrypto_backend=openssl
            ninja -C build
            sudo -E meson install -C build --strip
            popd
          else
            echo "apk-tools 缓存命中，跳过编译"
          fi

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Verify toolchain
        run: |
          command -v apk >/dev/null || { echo "::error::apk 未正确安装"; exit 1; }
          command -v po2lmo >/dev/null || { echo "::error::po2lmo 未正确安装"; exit 1; }
          command -v ipkg-build >/dev/null || { echo "::error::ipkg-build 未正确安装"; exit 1; }
          apk --version

      - name: Build packages (apk + ipk)
        run: |
          fakeroot bash .github/build-pkg.sh apk "${{ github.event_name }}"
          fakeroot bash .github/build-pkg.sh ipk "${{ github.event_name }}"
          shopt -s nullglob
          apks=(.github/luci-*.apk)
          ipks=(.github/luci-*.ipk)
          if [ "${#apks[@]}" -eq 0 ] || [ "${#ipks[@]}" -eq 0 ]; then
            echo "::error::未生成预期的 luci-*.apk / luci-*.ipk 文件"
            ls -la .github/*.apk .github/*.ipk 2>/dev/null || true
            exit 1
          fi
          printf '生成的包:\n%s\n' "${apks[@]}" "${ipks[@]}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homeproxy-packages-${{ needs.job_check.outputs.version }}
          include-hidden-files: true
          path: |
            .github/luci-*.apk
            .github/luci-*.ipk

      - name: Attach packages to release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0
        with:
          tag_name: v${{ needs.job_check.outputs.version }}
          files: |
            .github/luci-*.apk
            .github/luci-*.ipk
          token: ${{ github.token }}
