name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新的推送自动取消旧的运行，避免堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v4

      - name: Checkout apk-tools
        uses: actions/checkout@v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Checkout po2lmo
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Build packages (apk + ipk)
        run: |
          fakeroot bash .github/build-pkg.sh apk "${{ github.run_number }}"
          fakeroot bash .github/build-pkg.sh ipk "${{ github.run_number }}"
          ls -l .github/*.apk .github/*.ipk

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-packages
          include-hidden-files: true
          path: |
            .github/*.apk
            .github/*.ipk

      - name: Cleanup old release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/luci-app-homeproxy" | jq -r '.id') || true
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -r '.[].id')
            for asset_id in $ASSETS; do
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id" || true
            done
          fi

      - name: Publish to Latest Build Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luci-app-homeproxy
          name: HomeProxy Latest Build
          body: |
            Automatically built on ${{ github.run_id }}.
            Commit: ${{ github.sha }}
          files: |
            .github/luci-app-homeproxy-*.apk
            .github/luci-app-homeproxy-*.ipk
            .github/luci-i18n-homeproxy-zh-cn-*.apk
            .github/luci-i18n-homeproxy-zh-cn-*.ipk
          token: ${{ github.token }}

  clash-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apk-tools
        uses: actions/checkout@v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Install host dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build libssl-dev lua5.1

      - name: Build apk-tools
        run: |
          pushd apk-tools
          meson setup build \
            -Db_lto=true -Dcompressed-help=false -Ddocs=disabled -Dhelp=enabled \
            -Dlua_version=5.1 -Ddefault_library=static -Durl_backend=wget \
            -Dzstd=false -Dpython=disabled -Dtests=disabled -Dcrypto_backend=openssl
          ninja -C build
          sudo meson install -C build --strip
          popd
          apk --version

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: homeproxy-packages
          path: pkg

      - name: Fetch dependency packages from ImmortalWrt 25.12.1
        run: |
          set -eo pipefail
          mkdir -p deps && cd deps
          # 依赖可能位于 packages 或 luci 源，逐个尝试
          for p in sing-box firewall4 ucode-mod-digest; do
            f=""
            for REPO in \
              "https://downloads.immortalwrt.org/releases/25.12.1/packages/x86_64/packages" \
              "https://downloads.immortalwrt.org/releases/25.12.1/packages/x86_64/luci"; do
              f="$(curl -fsSL "$REPO/" | grep -oE "${p}-[0-9][^"<>]*\.apk" | head -n1)"
              [ -n "$f" ] && break
            done
            [ -n "$f" ] || { echo "未在仓库找到 $p"; exit 1; }
            echo "fetching $f"
            curl -fsSLO "$REPO/$f"
            # 改名为固定名，避免同名前缀包被 glob 误匹配
            mv "$f" "${p}.apk"
          done
          ls -l

      - name: Check file ownership clashes
        run: |
          set -eo pipefail
          # 将每个包的文件清单（不含 apk 元数据）提取为排序列表
          extract_list() {
            local apkfile="$1" out="$2" dir
            dir="$(mktemp -d)"
            apk extract --allow-untrusted --no-chown --destination "$dir" "$apkfile"
            ( cd "$dir" && find . \( -type f -o -type l \) ! -path './lib/apk/packages/*' \
                | sed 's|^\./|/|' | sort ) > "$out"
            rm -rf "$dir"
          }

          extract_list "$(ls pkg/luci-app-homeproxy-*.apk)" ours-app.txt
          extract_list "$(ls pkg/luci-i18n-homeproxy-zh-cn-*.apk)" ours-i18n.txt
          extract_list deps/sing-box.apk dep0.txt
          extract_list deps/firewall4.apk dep1.txt
          extract_list deps/ucode-mod-digest.apk dep2.txt

          echo "=== 本包文件数 ==="; wc -l ours-app.txt ours-i18n.txt
                    echo "=== 依赖文件数 ==="; wc -l dep*.txt

          fail=0
          for pair in "ours-app.txt dep0.txt" "ours-i18n.txt dep0.txt" "ours-app.txt dep1.txt" "ours-i18n.txt dep1.txt" "ours-app.txt dep2.txt" "ours-i18n.txt dep2.txt"; do
            set -- $pair
            echo "=== 冲突检查: $1 vs $2 ==="
            if comm -12 "$1" "$2" | tee /dev/stderr | grep -q .; then
              echo "ERROR: $1 与 $2 存在相同归属文件（封装镜像会冲突）"
              fail=1
            else
              echo "OK: 无冲突"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Upload clash-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clash-check-report
          path: |
            ours-app.txt
            ours-i18n.txt
            dep*.txt
